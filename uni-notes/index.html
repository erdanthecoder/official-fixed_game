    <!--
      iOS. Apple has never implemented the manifest properly, so an installed
      web app needs its own set of tags to behave like an app rather than a
      bookmark that opens Safari.

      `black-translucent` puts our own background behind the status bar, which
      is what makes the app reach the top of the screen. It also means the clock
      overlaps our content unless the layout respects safe-area insets — global
      .css does, via env(safe-area-inset-*).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Uni" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      The first paint happens before React loads, so the splash lives in the
      HTML. Without it a cold load on a slow connection shows a white page.
      App.jsx removes it once the shell is mounted.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #071e2f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #0f4f74 0%, #071e2f 62%);
        color: #cfe4f2;
        font: 500 0.85rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.01em;
        z-index: 999;
        transition: opacity 0.28s ease;
      }
      #boot.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
      }
      #boot-bar {
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      #boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #f0a44a;
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>

  <body>

      <div id="boot-bar"><i></i></div>
