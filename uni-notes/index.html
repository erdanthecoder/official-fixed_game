    <title>Kadam — everything for your university application</title>
    <meta
      name="description"
      content="Notes, spreadsheets, slide decks, boards, deadlines and vocabulary practice for planning university applications — in one place, and shareable with the people helping you."

    <!--
      iOS. Apple has never implemented the manifest properly, so an installed
      web app needs its own set of tags to behave like an app rather than a
      bookmark that opens Safari.

      `black-translucent` puts our own background behind the status bar, which
      is what makes the app reach the top of the screen. It also means the clock
      overlaps our content unless the layout respects safe-area insets — global
      .css does, via env(safe-area-inset-*).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kadam" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      The first paint happens before React loads, so the splash lives in the
      HTML. Without it a cold load on a slow connection shows a white page.
      App.jsx removes it once the shell is mounted.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #071e2f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #0f4f74 0%, #071e2f 62%);
        color: #cfe4f2;
        font: 500 0.85rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.01em;
        z-index: 999;
        transition: opacity 0.28s ease;
      }
      #boot.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
      }
      /* --- the game ------------------------------------------------------ */

      #boot-stack {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      #boot-game-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: min(560px, calc(100vw - 40px));
      }

      #boot-game {
        width: 100%;
        height: auto;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.035);
        box-shadow: inset 0 0 0 1px rgba(226, 240, 250, 0.09);
        /* Pixels are the point; do not let the browser smooth them away when
           the canvas is scaled up to fill the width. */
        image-rendering: pixelated;
        touch-action: manipulation;
        cursor: pointer;
      }

      #boot-game-hint {
        margin: 0;
        color: rgba(226, 240, 250, 0.38);
        font: 400 0.74rem 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
        letter-spacing: 0.02em;
      }

      #boot-tip {
        max-width: 30rem;
        margin: 0;
        padding: 0 24px;
        color: rgba(226, 240, 250, 0.72);
        font: 400 0.92rem/1.55 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
        text-align: center;
        animation: tip-in 520ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes tip-in {
        from {
          transform: translateY(6px);
          opacity: 0.001;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      #boot-stuck {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 26px;
        color: rgba(255, 255, 255, 0.86);
        font: 500 0.95rem/1.5 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
        text-align: center;
      }
      #boot-retry {
        padding: 11px 22px;
        border: 0;
        border-radius: 999px;
        background: #f0a44a;
        color: #22160a;
        font: 600 0.95rem 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
        cursor: pointer;
      }
      #boot-bar {
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      #boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #f0a44a;
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar i {
          animation: none;
          width: 100%;
        }
        #boot-tip {
          animation: none;
        }
      }
    </style>

    <!--
      Runs before the first paint. Without it a dark-mode user gets one white
      frame on every launch, which on a phone reads as a flash. It only decides
      light or dark; the real setting still lives in the account and takes over
      the moment React mounts.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('uni.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* nothing to do — the app starts light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="boot">
      <!--
        Something to do while it loads.

        A pixel runner, drawn on a canvas, playable with a tap or the space
        bar. Ours rather than Chrome's: the idea of a dinosaur jumping cacti is
        anyone's, the artwork is not, so every sprite below is a grid written by
        hand in this file.

        It has to live here, in the page itself, because this screen exists
        precisely when none of the app has loaded. That rules out any library
        and most cleverness — which is fine, because the whole thing is a few
        rectangles and one number going up.
      -->
      <div id="boot-stack">
        <img src="./icon.svg" alt="" width="68" height="68" />
        <div id="boot-bar"><i></i></div>

        <div id="boot-game-wrap">
          <canvas id="boot-game" width="600" height="170"></canvas>
          <p id="boot-game-hint">Tap or press space to jump</p>
        </div>

        <p id="boot-tip"></p>
        <div id="boot-stuck" hidden>
          <p>Kadam is taking longer than it should.</p>
          <button type="button" id="boot-retry">Try again</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      /*
       * The last resort.
       *
       * Everything below this line in the app has its own error handling; this
       * is for the failures that stop the app existing at all — a chunk that
       * never arrives, a service worker holding a build whose files have been
       * replaced, a network that accepts the request and then goes quiet. In
       * every one of those the person is left looking at a loading bar that
       * will never finish, with nothing to press.
       *
       * Twelve seconds is long enough that a slow connection is not insulted
       * and short enough that nobody has given up yet. The button throws away
       * the cached copy of the app and starts again from the network, which is
       * the fix for the whole class of problem and cannot make anything worse:
       * documents live in Firestore and IndexedDB, not in here.
       */
      /*
       * The runner.
       *
       * Sprites are grids of characters, which is the only way to draw pixel
       * art that anyone can still edit a year later: the shape in the source
       * is the shape on the screen. '#' is a filled pixel, anything else is
       * empty.
       */
      var DINO = [
        '.......#####',
        '.......##.###',
        '.......######',
        '.......#####.',
        '.......####..',
        '#......###...',
        '##.....#####.',
        '###...#######',
        '####.########',
        '.###########.',
        '..##########.',
        '...########..',
        '....######...',
        '....##..##...',
      ];
      // Only the feet change while running, so only the feet are duplicated.
      var FEET = [
        ['....##..##...', '....##...#...'],
        ['....##..##...', '....#...##...'],
      ];
      var CACTUS = [
        '..#..',
        '..#..',
        '#.#..',
        '#.#.#',
        '###.#',
        '..###',
        '..#..',
        '..#..',
        '..#..',
      ];
      var CACTUS_BIG = [
        '..#...',
        '..#...',
        '#.#..#',
        '#.#..#',
        '#.####',
        '###..#',
        '..#...',
        '..#...',
        '..#...',
        '..#...',
        '..#...',
      ];

      (function runner() {
        var canvas = document.getElementById('boot-game');
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext('2d');

        var W = canvas.width;
        var H = canvas.height;
        var PX = 4; // one sprite pixel, in canvas pixels
        var GROUND = H - 26;

        var INK = '#e2eaf0';
        var ACCENT = '#f0a44a';
        var FAINT = 'rgba(226, 234, 240, 0.22)';

        function draw(grid, x, y, colour) {
          ctx.fillStyle = colour;
          for (var row = 0; row < grid.length; row += 1) {
            for (var col = 0; col < grid[row].length; col += 1) {
              if (grid[row][col] === '#') {
                ctx.fillRect(x + col * PX, y + row * PX, PX, PX);
              }
            }
          }
        }

        var dino = { y: 0, vy: 0, jumping: false };
        var obstacles = [];
        var speed = 3.4;
        var frame = 0;
        var score = 0;
        var best = 0;
        var flash = 0;
        var running = true;

        var dinoH = DINO.length * PX;
        var dinoW = 13 * PX;
        var dinoX = 46;

        function reset() {
          obstacles = [];
          speed = 3.4;
          if (score > best) best = score;
          score = 0;
          dino.y = 0;
          dino.vy = 0;
          dino.jumping = false;
        }

        function jump() {
          if (dino.jumping) return;
          dino.jumping = true;
          // Tuned against the canvas, not guessed: any harder and the top of
          // the jump is clipped off the top edge.
          dino.vy = -9.2;
        }

        function spawn() {
          var last = obstacles[obstacles.length - 1];
          var gap = 190 + Math.random() * 190;
          if (last && W - last.x < gap) return;
          if (!last || last.x < W - gap) {
            var big = Math.random() < 0.35;
            var grid = big ? CACTUS_BIG : CACTUS;
            obstacles.push({
              x: W + 10,
              grid: grid,
              w: grid[0].length * PX,
              h: grid.length * PX,
            });
          }
        }

        function hits(o) {
          // Forgiving boxes. A pixel-perfect hit on a sprite this small feels
          // unfair, and this is a loading screen, not a competition.
          var dx = dinoX + 6;
          var dw = dinoW - 12;
          var dy = GROUND - dinoH + dino.y + 4;
          var dh = dinoH - 8;
          var ox = o.x + 3;
          var ow = o.w - 6;
          var oy = GROUND - o.h;
          return dx < ox + ow && dx + dw > ox && dy < oy + o.h && dy + dh > oy;
        }

        function scene() {
          ctx.clearRect(0, 0, W, H);

          // Ground: a line, and specks of grit moving with it.
          ctx.fillStyle = FAINT;
          ctx.fillRect(0, GROUND, W, 2);
          for (var i = 0; i < 26; i += 1) {
            var gx = (i * 61 - (frame * speed) / 2) % (W + 40);
            if (gx < -10) gx += W + 40;
            ctx.fillRect(gx, GROUND + 8 + ((i * 7) % 9), 3, 2);
          }

          for (var o = 0; o < obstacles.length; o += 1) {
            draw(obstacles[o].grid, obstacles[o].x, GROUND - obstacles[o].h, INK);
          }

          // Legs alternate every eight frames, and stop while airborne.
          var body = DINO.slice(0, DINO.length - 1);
          var feet = dino.jumping ? FEET[0][0] : FEET[Math.floor(frame / 8) % 2][1];
          draw(body, dinoX, GROUND - dinoH + dino.y, flash > 0 ? '#f28b82' : ACCENT);
          draw([feet], dinoX, GROUND - PX + dino.y, flash > 0 ? '#f28b82' : ACCENT);

          ctx.fillStyle = 'rgba(226, 234, 240, 0.5)';
          ctx.font = '600 13px "SFMono-Regular", Consolas, monospace';
          ctx.textAlign = 'right';
          ctx.fillText((best ? 'HI ' + String(best) + '   ' : '') + String(score), W - 14, 24);
        }

        function tick() {
          if (!running) return;
          frame += 1;

          if (document.visibilityState === 'visible') {
            dino.vy += 0.55;
            dino.y += dino.vy;
            if (dino.y >= 0) {
              dino.y = 0;
              dino.vy = 0;
              dino.jumping = false;
            }

            spawn();
            for (var i = obstacles.length - 1; i >= 0; i -= 1) {
              obstacles[i].x -= speed;
              if (obstacles[i].x + obstacles[i].w < -10) obstacles.splice(i, 1);
              else if (flash === 0 && hits(obstacles[i])) {
                flash = 26;
                reset();
                break;
              }
            }

            if (flash > 0) flash -= 1;
            speed += 0.0009;
            if (frame % 6 === 0) score += 1;
            scene();
          }

          requestAnimationFrame(tick);
        }

        var still =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (still) {
          // The drawing, without the running.
          running = false;
          obstacles.push({ x: 420, grid: CACTUS, w: CACTUS[0].length * PX, h: CACTUS.length * PX });
          scene();
        } else {
          requestAnimationFrame(tick);
        }

        document.addEventListener('keydown', function (event) {
          if (event.code === 'Space' || event.code === 'ArrowUp' || event.key === ' ') {
            // Only while the loading screen is the thing on screen.
            var boot = document.getElementById('boot');
            if (!boot || boot.classList.contains('is-gone')) return;
            event.preventDefault();
            jump();
          }
        });
        canvas.addEventListener('pointerdown', function (event) {
          event.preventDefault();
          jump();
        });
      })();

      /*
       * Tips while it loads.
       *
       * Written out here rather than imported from the app's tip list, because
       * this screen exists precisely when none of the app has loaded. Six short
       * ones, kept deliberately separate from src/i18n/tips.js — trying to
       * share them would mean shipping part of the app before the app, to save
       * eighteen lines.
       */
      var BOOT_TIPS = {
        en: [
          'Everything saves itself. There is no save button to forget.',
          'Ctrl+K finds any document, in any of the apps, from anywhere.',
          'Share a note and you both edit the same one — no versions flying about.',
          'In Sheets, start a cell with = to write a formula.',
          'Kadam works offline. What you type now syncs when the signal comes back.',
          'Invite someone as a viewer when you want an opinion, not an editor.',
        ],
        ru: [
          'Всё сохраняется само. Кнопки «сохранить» просто нет.',
          'Ctrl+K находит любой документ в любом приложении.',
          'Поделитесь заметкой — и вы редактируете одну и ту же.',
          'В таблицах начните ячейку с =, чтобы написать формулу.',
          'Kadam работает без интернета. Всё синхронизируется, когда он вернётся.',
          'Пригласите как читателя, если нужно мнение, а не правки.',
        ],
        ky: [
          'Баары өзү сакталат. «Сактоо» баскычы жок.',
          'Ctrl+K каалаган документти каалаган колдонмодон табат.',
          'Жазууну бөлүшсөңүз, экөөңүз бир эле документти оңдойсуңар.',
          'Таблицада уячаны = менен баштасаңыз, формула болот.',
          'Kadam интернетсиз да иштейт. Байланыш келгенде синхрондолот.',
          'Пикир гана керек болсо, окурман катары чакырыңыз.',
        ],
      };

      (function tips() {
        var el = document.getElementById('boot-tip');
        if (!el) return;

        var language = 'en';
        try {
          var saved = JSON.parse(localStorage.getItem('uni:v3') || '{}');
          if (saved.prefs && BOOT_TIPS[saved.prefs.language]) language = saved.prefs.language;
        } catch (error) {
          // No preferences yet, which is its own answer.
        }

        /*
         * Same rule as the app's own tips: a device with no keyboard is not
         * shown a shortcut. "Ctrl+K finds any document" is useful on a laptop
         * and quietly insulting on a tablet, which is what this is mostly read
         * on.
         */
        var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var list = BOOT_TIPS[language].filter(function (tip) {
          return !touch || !/ctrl|cmd|⌘|F2|Esc/i.test(tip);
        });
        if (!list.length) list = BOOT_TIPS[language];
        var at = Math.floor(Math.random() * list.length);

        var show = function () {
          el.textContent = list[at % list.length];
          // Restart the entrance, which otherwise only plays once.
          el.style.animation = 'none';
          void el.offsetWidth;
          el.style.animation = '';
          at += 1;
        };

        show();
        setInterval(show, 5200);
      })();

      function offerWayOut() {
        var boot = document.getElementById('boot');
        if (!boot || boot.classList.contains('is-gone')) return;
        var stuck = document.getElementById('boot-stuck');
        if (stuck) stuck.hidden = false;
      }

      // Eight seconds of nothing is already too long to sit and wonder.
      setTimeout(offerWayOut, 8000);

      // An uncaught error means the app is not going to start. There is no
      // reason to make anyone wait out the timer to be told so.
      window.addEventListener('error', offerWayOut);
      window.addEventListener('unhandledrejection', offerWayOut);

      document.getElementById('boot-retry').addEventListener('click', function () {
        var done = function () {
          location.reload();
        };
        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (names) {
            return Promise.all(names.map(function (name) { return caches.delete(name); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        // Reload regardless: a cleanup that hangs must not become a second
        // thing that never finishes.
        setTimeout(done, 2500);
        Promise.all(jobs).then(done, done);
      });
    </script>
