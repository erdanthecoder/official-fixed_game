<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Uni — everything for your university application</title>
    <meta
      name="description"
      content="Notes, spreadsheets, slide decks, an AI study helper and vocabulary practice for planning university applications. Saved to UniSave and shareable with the people helping you."
    />
    <meta name="theme-color" content="#0B4265" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Social preview -->
    <meta property="og:title" content="Uni — everything for your university application" />
    <meta
      property="og:description"
      content="Notes, sheets, slides, an AI study helper and vocabulary practice, in one place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icon-512.png" />

    <!--
      The first paint happens before React loads, so the splash lives in the
      HTML. Without it a cold load on a slow connection shows a white page.
      App.jsx removes it once the shell is mounted.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #071e2f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #0f4f74 0%, #071e2f 62%);
        color: #cfe4f2;
        font: 500 0.85rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.01em;
        z-index: 999;
        transition: opacity 0.28s ease;
      }
      #boot.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
      }
      #boot-bar {
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      #boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #f0a44a;
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="./icon.svg" alt="" width="68" height="68" />
      <div id="boot-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
