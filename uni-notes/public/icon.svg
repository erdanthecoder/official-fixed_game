<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kadam">
  <title>Kadam</title>
  <!--
    The Kadam mark.

    Kadam is "step" in Kyrgyz, and a Kyrgyz word deserves a Kyrgyz mark rather
    than a borrowed one. This is built the way a shyrdak is: a bordered felt
    panel, flat colour, and the figure mirrored top to bottom.

      · the field is felt cream, keylined in madder red — the panel edge
      · above and below the letter, кочкор мүйүз, the ram's horn: two mirrored
        spirals with a short bar between them, the most common motif in Kyrgyz
        ornament and the one that means increase and good fortune
      · the K is black and upright. The previous mark leaned twelve degrees
        because it was drawn after motorsport logotypes; leaning a letter that
        now sits inside an ornament would fight the symmetry the ornament is
        built on

    Flat colours throughout, no gradients. Felt appliqué has no gradients, and
    pretending otherwise is the sort of detail that makes a mark look like a
    costume rather than a thing from somewhere.

    The horns are drawn at stroke 3.2 on this grid — about a pixel at 32px,
    which holds. Below 32px they turn to specks, so the small favicons are
    rendered from the letter alone; see scratchpad/raster, and icon-16/32.

    Same geometry as src/components/brand/Logo.jsx. If you change a number
    here, change it there.
  -->
  <defs>
    <!-- One horn, pointing up and to the right. Everything else is this,
         mirrored or rotated. -->
    <path id="kadam-horn" d="M0 20 C0 9 6 2 13 2 C19 2 22 7 19 11 C16 14 11 12 12 8" />
  </defs>

  <rect width="64" height="64" rx="14.5" fill="#F4E9D8" />
  <!--
    Two keylines, not one. A shyrdak is bound at the edge: a fine line right at
    the hem and a heavier band inside it. One line reads as a box drawn round a
    letter; two read as a panel that was made.
  -->
  <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="12.4" fill="none" stroke="#A8342A" stroke-width="1.1" />
  <rect x="5.6" y="5.6" width="52.8" height="52.8" rx="10" fill="none" stroke="#A8342A" stroke-width="2.2" opacity="0.9" />

  <g id="kadam-ornament" fill="none" stroke-linecap="round" stroke-width="3">
    <g transform="translate(32 12.5) scale(0.34) translate(-24 -11)" stroke="#A8342A">
      <use href="#kadam-horn" />
      <use href="#kadam-horn" transform="translate(48 0) scale(-1 1)" />
      <path d="M22 22 L26 22" />
    </g>
    <g transform="translate(32 51.5) rotate(180) scale(0.34) translate(-24 -11)" stroke="#C9922B">
      <use href="#kadam-horn" />
      <use href="#kadam-horn" transform="translate(48 0) scale(-1 1)" />
      <path d="M22 22 L26 22" />
    </g>
  </g>

  <g transform="translate(21 20) scale(0.40)">
    <path
      fill="#1A1714"
      d="M0 0 L14 0 L14 25 L33 0 L46 0 L25 32 L46 64 L31 64 L14 39 L14 64 L0 64 Z"
    />
  </g>
</svg>
