<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kadam">
  <title>Kadam</title>
  <!--
    The Kadam mark: a heavy oblique K with the air still coming off it.

    Same geometry as src/components/brand/Logo.jsx, which is where the reasoning
    is written out in full. The short version:

      · a bold geometric K on a 64 cap height, sheared 12 degrees — stem 14,
        arm and leg 14 across the diagonal, inside the same 46-unit width the
        old U occupied, so the tile composition did not have to move
      · three speed bars behind it, longest and thickest at the top, each fading
        out backwards so they read as air left behind rather than as stripes

    The bars are 6 units thick because one pixel at favicon size is four units
    on this grid — a pixel and a half at 16px, which survives. Thinner versions
    were tried and turned to grey mush.

    If you change a number here, change it in Logo.jsx too.
  -->
  <defs>
    <linearGradient id="uni-tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0%" stop-color="#17739B" />
      <stop offset="52%" stop-color="#0B4265" />
      <stop offset="100%" stop-color="#04203A" />
    </linearGradient>
    <linearGradient id="uni-ink" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="42%" stop-color="#FFF1D6" />
      <stop offset="76%" stop-color="#FDBB5A" />
      <stop offset="100%" stop-color="#E4801A" />
    </linearGradient>
    <linearGradient id="uni-speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDBB5A" stop-opacity="0" />
      <stop offset="100%" stop-color="#FDBB5A" />
    </linearGradient>
    <radialGradient id="uni-sheen" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14.5" fill="url(#uni-tile)" />
  <rect width="64" height="64" rx="14.5" fill="url(#uni-sheen)" />

  <!-- The air -->
  <rect x="8" y="19" width="16" height="6" rx="3" fill="url(#uni-speed)" />
  <rect x="8" y="29" width="13" height="6" rx="3" fill="url(#uni-speed)" />
  <rect x="8" y="39" width="10" height="6" rx="3" fill="url(#uni-speed)" />

  <!-- The U -->
  <g transform="translate(26 16) scale(0.53)">
    <g transform="skewX(-12) translate(6 0)">
      <path
        d="M0 0 L14 0 L14 25 L33 0 L46 0 L25 32 L46 64 L31 64 L14 39 L14 64 L0 64 Z"
        fill="url(#uni-ink)"
      />
    </g>
  </g>
</svg>
