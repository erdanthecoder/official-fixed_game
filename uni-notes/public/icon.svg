<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Uni">
  <title>Uni</title>
  <!--
    The mark: a heavy U — the basin of Issyk-Kul, and the app's initial —
    cradling a low amber sun.

    Rules this obeys, because an icon lives or dies at 16px:
      · one tile colour, one light form, one warm accent. Nothing else.
      · stroke weight 78/512 (≈15%), so the U never thins into a hairline.
      · all art inside the central 76%, which keeps it safe under the
        circular mask Android and iOS apply.
  -->
  <defs>
    <linearGradient id="uni-tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#125E86" />
      <stop offset="55%" stop-color="#0B4265" />
      <stop offset="100%" stop-color="#062B44" />
    </linearGradient>
    <linearGradient id="uni-stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D8ECF6" />
    </linearGradient>
    <linearGradient id="uni-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC978" />
      <stop offset="100%" stop-color="#EE9134" />
    </linearGradient>
    <radialGradient id="uni-sheen" cx="0.5" cy="0.02" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#uni-tile)" />
  <rect width="512" height="512" rx="116" fill="url(#uni-sheen)" />

  <!-- The sun, held in the mouth of the U -->
  <circle cx="256" cy="203" r="42" fill="url(#uni-sun)" />

  <!-- The U: two verticals joined by a true semicircle -->
  <path
    d="M150 140 L150 268 A106 106 0 0 0 362 268 L362 140"
    fill="none"
    stroke="url(#uni-stroke)"
    stroke-width="78"
    stroke-linecap="round"
  />
</svg>
