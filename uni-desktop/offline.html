<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uni</title>
    <style>
      /* Deliberately plain and self-contained. This page loads exactly when the
         network is not working, so it cannot fetch a font, a stylesheet or an
         image — everything it needs is in this file. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1418;
        color: #e3e7ea;
        font:
          400 15px/1.6 'Segoe UI',
          system-ui,
          sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        max-width: 30rem;
        padding: 32px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.4rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: #9aa6b1;
      }
      button {
        min-height: 40px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #7cb0f5;
        color: #0b1116;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #9cc4f8;
      }
      small {
        display: block;
        margin-top: 22px;
        color: #62707c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Uni cannot reach the internet</h1>
      <p>
        Nothing has been lost. Anything written while offline is kept on this computer and syncs
        by itself once the connection is back.
      </p>
      <button id="retry" type="button">Try again</button>
      <small>If this keeps happening, check the Wi-Fi and open Uni again.</small>
    </main>
    <script>
      // The address to go back to is passed in the query string by main.js —
      // this page has no other way to be told, by design.
      var target = new URLSearchParams(location.search).get('u');
      document.getElementById('retry').addEventListener('click', function () {
        if (target) location.href = target;
      });
    </script>
  </body>
</html>
