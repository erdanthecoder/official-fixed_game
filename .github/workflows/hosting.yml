# Publishes Uni to Firebase Hosting.
#
# This exists for one reason, and it is the difference between the Android app
# feeling like an app and feeling like a bookmark.
#
# Android hides Chrome's address bar only when the site proves it owns the app,
# by serving a file at the VERY ROOT of the domain:
#
#     https://<domain>/.well-known/assetlinks.json
#
# On GitHub Pages the site lives at github.io/official-fixed_game/ and the root
# of github.io belongs to GitHub, so that file can never be put there. No amount
# of work on the app fixes it — the address bar is a property of the domain.
#
# Firebase Hosting gives a root we control: unisave-e8483.web.app. The asset
# links land where Android looks, the bar disappears, and the app opens like an
# installed app because at that point it is one.
#
# Hosting is free on the Spark plan. Nothing here needs Blaze.
#
# ── One-time setup, in a browser ─────────────────────────────────────────────
# Exactly the same secret the Cloud Functions workflow uses. If it is already
# set, this workflow needs nothing at all.
#
#   1. Firebase Console -> gear -> Project settings -> Service accounts
#      -> Generate new private key. A .json downloads.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret
#        Name:  FIREBASE_SERVICE_ACCOUNT
#        Value: the entire contents of that .json file
#   3. Firebase Console -> Authentication -> Settings -> Authorized domains
#      -> add unisave-e8483.web.app, or sign-in opens and closes again.

name: Publish to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [claude/uni-notes-editor-wilz3q]
    paths:
      - 'uni-notes/**'
      - '.github/workflows/hosting.yml'

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Skip quietly rather than failing red on every push. Someone who has not
      # set the secret yet has a working site on Pages; a red cross on every
      # commit would just be noise telling them off for it.
      - name: Is the secret set?
        id: gate
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, so nothing was deployed. See the comments at the top of this workflow."
          else
            echo "$KEY" | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8"))' \
              || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the whole file, braces included."; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the credentials
        if: steps.gate.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Outside the workspace, so no later step can upload it by accident.
          printf '%s' "$KEY" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(node -p "require('$RUNNER_TEMP/gcp-key.json').project_id")" >> "$GITHUB_ENV"

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        working-directory: uni-notes
        env:
          # A Firebase web config is designed to ship inside the browser and is
          # already readable in the built bundle. It is not a credential; the
          # Firestore rules and sign-in are what protect the data.
          VITE_FIREBASE_API_KEY: AIzaSyBoZMgZUEc_mNf7xkKElQddGp8EZOwrjHs
          VITE_FIREBASE_AUTH_DOMAIN: unisave-e8483.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: unisave-e8483
          VITE_FIREBASE_STORAGE_BUCKET: unisave-e8483.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '905127413855'
          VITE_FIREBASE_APP_ID: '1:905127413855:web:1a01eb17a3d8115908f3ea'
          VITE_FIREBASE_REGION: us-central1
        run: |
          npm ci
          npm run build
          # The asset links are a public file, not an asset — Vite copies
          # public/ verbatim, so this is a check rather than a copy.
          test -f dist/.well-known/assetlinks.json \
            && echo "Asset links will be served." \
            || echo "::warning::No asset links yet. Run the Android build once; it writes them."

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        working-directory: uni-notes
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive

      # Rules are the half of a feature that lives on the server: presence,
      # sharing and every document boundary are enforced here, so shipping new
      # client code against last week's rules is a broken deploy that looks
      # successful.
      #
      # Separate from hosting, and allowed to fail, because deploying rules
      # asks serviceusage.googleapis.com whether Firestore is enabled — a call
      # the plain Firebase Admin service account is not granted. If it has not
      # been granted here, the site must still go live; the summary below says
      # exactly what to click.
      # A web address is the part of this that people actually type and read
      # out to each other, and unisave-e8483.web.app is a project id, not a
      # name — the digits are there because Firebase had to make it unique, not
      # because they mean anything.
      #
      # A project may hold several hosting sites. This adds one with a name a
      # person would choose, and serves exactly the same build from it. The old
      # address keeps working, which matters: it is the one the installed
      # Android app and its asset links point at, and breaking that would log
      # everybody out of an app they already have.
      #
      # Names are global across Firebase, so the good ones go early. The list is
      # tried in order and the first one free is kept; on every later run the
      # site already exists and this step just finds it again.
      - name: A friendlier address
        id: nice
        if: steps.gate.outputs.ready == 'true'
        working-directory: uni-notes
        continue-on-error: true
        run: |
          set -u
          read_sites() {
            firebase hosting:sites:list --project "$PROJECT_ID" --json 2>/dev/null \
              | node -e '
                  let raw = "";
                  process.stdin.on("data", (d) => (raw += d));
                  process.stdin.on("end", () => {
                    try {
                      const sites = JSON.parse(raw).result.sites ?? [];
                      console.log(
                        sites
                          .map((s) => String(s.name).split("/").pop())
                          .filter((id) => id !== process.env.PROJECT_ID)
                          .join("\n"),
                      );
                    } catch { /* no sites, or not readable */ }
                  });
                '
          }

          # The name we want, if we can have it. An existing site with this
          # name is reused; otherwise it is created. Only if both fail does an
          # older site get used, so a rename does not silently keep publishing
          # under the previous name.
          WANTED=kadam
          EXISTING="$(read_sites)"

          if echo "$EXISTING" | grep -qx "$WANTED"; then
            SITE="$WANTED"
          elif firebase hosting:sites:create "$WANTED" --project "$PROJECT_ID" --non-interactive; then
            SITE="$WANTED"
          else
            echo "$WANTED is taken; falling back to a site this project already has."
            SITE="$(echo "$EXISTING" | head -n1)"
          fi

          if [ -z "$SITE" ]; then
            echo "::warning::Could not claim a friendlier address; the project address still works."
            exit 0
          fi

          echo "site=$SITE" >> "$GITHUB_OUTPUT"

          # Same build, second address. firebase.json names the site to publish
          # to, and the runner is thrown away afterwards, so editing it here
          # changes nothing in the repository.
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            config.hosting.site = process.argv[1];
            fs.writeFileSync("firebase.json", JSON.stringify(config, null, 2));
          ' "$SITE"

          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Deploy the security rules
        id: rules
        if: steps.gate.outputs.ready == 'true'
        working-directory: uni-notes
        continue-on-error: true
        run: firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive

      - name: What happened
        if: always()
        run: |
          {
            echo "### Firebase Hosting"
            echo
            if [ "${{ steps.gate.outputs.ready }}" = "true" ]; then
              echo "Live at **https://unisave-e8483.web.app**"
              echo
              echo "This is the address the Android app should point at. Run"
              echo "**Build Android APK** with that URL and the address bar goes away,"
              echo "because the asset links are now served from a domain root we own."
              echo
              if [ -n "${{ steps.nice.outputs.site }}" ]; then
                echo "Also live, and easier to say out loud, at"
                echo "**https://${{ steps.nice.outputs.site }}.web.app**"
                echo
                echo "If sign-in opens and closes again on the new address, add"
                echo "\`${{ steps.nice.outputs.site }}.web.app\` to Firebase Console ->"
                echo "Authentication -> Settings -> Authorized domains. The old address is"
                echo "unaffected either way, and the installed Android app still uses it."
              else
                echo "If sign-in opens and closes immediately, add \`unisave-e8483.web.app\`"
                echo "to Firebase Console -> Authentication -> Settings -> Authorized domains."
              fi
              echo
              if [ "${{ steps.rules.outcome }}" = "success" ]; then
                echo "Security rules deployed."
              else
                echo "**The security rules were not deployed.** Everything already"
                echo "working is unaffected, but anything that needs a new rule —"
                echo "seeing who else is in a document, for one — will be refused"
                echo "until they are."
                echo
                echo "One click, once: Google Cloud Console -> IAM, find the"
                echo "\`firebase-adminsdk\` service account, and add the role"
                echo "**Service Usage Consumer**. Then re-run this workflow."
                echo
                echo "Or from a laptop, in \`uni-notes/\`: \`npm run deploy:rules\`."
              fi
            else
              echo "Nothing deployed — \`FIREBASE_SERVICE_ACCOUNT\` is not set."
              echo "The GitHub Pages site is unaffected and still live."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
