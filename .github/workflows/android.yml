# Builds the Android app, so nobody needs a JDK, the Android SDK or Bubblewrap
# on their own machine.
#
# Run it from the Actions tab: "Build Android APK" -> Run workflow. It puts
# `Uni.apk` on the repository's Releases page as a plain download link — open
# that link on the phone, tap the file, allow installing from that source, done.
# No Play Store, no GitHub login, nothing to unzip.
#
# The app is a Trusted Web Activity around the deployed site, so the site has to
# be live first. It reads uni-notes/twa-manifest.json, which is checked in —
# that is what keeps the build non-interactive.
#
# SIGNING. First run generates a keystore and hands it back as an artifact —
# never as part of the Release, which is public. Android refuses to install an
# update signed with a different key than the version already on the phone, so
# save it into the repo secrets straight away and every later build reuses it:
#
#   ANDROID_KEYSTORE_BASE64   base64 of android.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#
# Lose the keystore and you cannot update an installed app — only uninstall and
# reinstall, which is a shrug for two phones and fatal on Play.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Address the app should open (with https://)'
        required: false
        default: 'https://erdanthecoder.github.io/official-fixed_game/'

  # Also builds when this workflow or the app it packages changes. Two reasons:
  # GitHub will not show a "Run workflow" button for a workflow that has never
  # run, and a change to any of these paths is exactly when a fresh installer is
  # wanted anyway. Editing the site does not trigger it — the app loads the site
  # live, so a new installer is not needed for that.
  push:
    branches: [claude/uni-notes-editor-wilz3q]
    paths:
      - '.github/workflows/android.yml'
      - 'uni-notes/twa-manifest.json'

permissions:
  contents: write # needed to publish the Release

jobs:
  build:
    # `inputs` is empty when this runs from a push rather than the button, so
    # the address is settled once here and every step below reads it from
    # $APP_URL instead of guessing.
    env:
      APP_URL: ${{ inputs.url || 'https://erdanthecoder.github.io/official-fixed_game/' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uni-notes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail early and clearly if the site is not deployed yet — otherwise
      # Bubblewrap fails much later with something far less obvious.
      - name: Check the site is live
        run: |
          URL="${APP_URL}manifest.webmanifest"
          echo "Fetching $URL"
          if ! curl -fsSL --retry 3 "$URL" -o /tmp/manifest.json; then
            echo "::error::$URL is not reachable. Deploy the site first, then run this again."
            exit 1
          fi
          cat /tmp/manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Two things Bubblewrap needs before it will build anything, both of them
      # about finding tools that are already on the runner.
      #
      # First, without a ~/.bubblewrap/config.json it opens its first-time setup
      # wizard — "Do you want Bubblewrap to install the JDK?" — and eats the
      # keystore passwords piped to stdin below as answers to it.
      #
      # Second, it looks for sdkmanager at <sdk>/tools/bin or <sdk>/bin and
      # refuses the SDK path outright if neither exists. GitHub's image ships the
      # command-line tools at <sdk>/cmdline-tools/latest instead. The link below
      # is to that whole directory rather than to its bin/, because the
      # sdkmanager script locates its own jars at ../lib relative to itself —
      # linking bin/ alone leaves it looking for <sdk>/lib and failing with
      # "Could not find or load main class ... SdkManagerCli". Linking the pair
      # keeps bin/ and lib/ together, and <sdk> itself stays the real SDK root,
      # which is what Bubblewrap passes to Gradle as ANDROID_HOME.
      - name: Point Bubblewrap at the JDK and Android SDK already installed
        run: |
          test -d "$JAVA_HOME" || { echo "::error::JAVA_HOME is not a directory: $JAVA_HOME"; exit 1; }
          test -d "$ANDROID_HOME" || { echo "::error::ANDROID_HOME is not a directory: $ANDROID_HOME"; exit 1; }

          if [ ! -x "$ANDROID_HOME/tools/bin/sdkmanager" ] && [ ! -x "$ANDROID_HOME/bin/sdkmanager" ]; then
            # Prefer the `latest` alias; fall back to the highest-numbered
            # package if this image does not have one.
            CMDLINE="$ANDROID_HOME/cmdline-tools/latest"
            if [ ! -x "$CMDLINE/bin/sdkmanager" ]; then
              CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
            fi
            test -x "$CMDLINE/bin/sdkmanager" \
              || { echo "::error::No sdkmanager found under $ANDROID_HOME/cmdline-tools."; exit 1; }
            ln -sfn "$CMDLINE" "$ANDROID_HOME/tools" 2>/dev/null \
              || sudo ln -sfn "$CMDLINE" "$ANDROID_HOME/tools"
          fi
          # Proves the whole chain — script found, jars found, Java happy — here
          # rather than fifteen steps later inside Gradle.
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          mkdir -p "$HOME/.bubblewrap"
          node -e "
            const fs = require('fs');
            fs.writeFileSync(process.env.HOME + '/.bubblewrap/config.json', JSON.stringify({
              jdkPath: process.env.JAVA_HOME,
              androidSdkPath: process.env.ANDROID_HOME,
            }, null, 2));
          "
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android.keystore
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Reusing the stored keystore."
          else
            # A throwaway-but-persistent key. The passwords are not a secret in
            # any meaningful sense on the first run; the point is that the same
            # key gets reused, which is what lets updates install over old ones.
            keytool -genkeypair -v -keystore android.keystore \
              -alias uni -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass unisave -keypass unisave \
              -dname "CN=Uni, OU=Uni, O=Uni, L=Bishkek, C=KG"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A new keystore was generated. Download the uni-android artifact and save android.keystore into repo secrets as ANDROID_KEYSTORE_BASE64, or future builds will not install over this one."
          fi

      - name: Build
        env:
          BASE: ${{ env.APP_URL }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'unisave' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'unisave' }}
        run: |
          # Retarget the checked-in manifest. This takes a whole base URL rather
          # than a hostname because GitHub Pages serves the app from a subpath
          # (/official-fixed_game/), so swapping the host alone would leave every
          # path pointing at the root of the domain, where nothing exists.
          node -e "
            const fs = require('fs');
            const base = new URL(process.env.BASE.endsWith('/') ? process.env.BASE : process.env.BASE + '/');
            const at = (p) => new URL(p.replace(/^\\//, ''), base).href;   // absolute, under the base
            const rel = (p) => base.pathname + p.replace(/^\\//, '');       // path the app navigates to
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.host = base.host;
            m.startUrl = rel('/');
            m.webManifestUrl = at('manifest.webmanifest');
            m.iconUrl = at('icon-512.png');
            m.maskableIconUrl = at('icon-maskable-512.png');
            m.fullScopeUrl = base.href;
            (m.shortcuts || []).forEach((sc) => {
              sc.url = rel(sc.url.replace(base.pathname, '/'));
              sc.chosenIconUrl = at(sc.chosenIconUrl.split('/').pop());
            });
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log(JSON.stringify(m, null, 2));
          "
          # Nothing here answers a prompt, which is the point. Three runs were
          # lost to feeding answers down stdin and having them eaten by a
          # question that was not the one being counted on. Bubblewrap has a
          # non-interactive route for every step, so use it and pipe nothing:
          #
          #   update --skipVersionUpgrade  generates the Android project from
          #     twa-manifest.json (it is not checked in — only the manifest is)
          #     and writes manifest-checksum.txt. Without that file, `build`
          #     stops to ask whether to regenerate. The flag also skips the one
          #     prompt `update` itself has, for a new version name.
          #   BUBBLEWRAP_*_PASSWORD  read before the signing prompts are shown,
          #     so the prompts never appear.
          #
          # </dev/null means any prompt still left fails immediately instead of
          # hanging for six hours waiting for a terminal that is not there.
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$STORE_PASS"
          export BUBBLEWRAP_KEY_PASSWORD="$KEY_PASS"
          bubblewrap update --skipVersionUpgrade </dev/null
          bubblewrap build --skipPwaValidation </dev/null

      # ------------------------------------------------------------------
      # The file that decides whether this is an app or a bookmark.
      #
      # Android only hides Chrome's address bar once the site proves it owns
      # the app, by serving /.well-known/assetlinks.json containing this
      # keystore's SHA-256 fingerprint. Without it the app opens in a Custom
      # Tab with a URL bar across the top — which is exactly what makes a TWA
      # feel like a home-screen shortcut instead of a real app.
      #
      # Generated here and committed back, so it can never drift from the key
      # that actually signed the APK. Doing it by hand means it is correct once
      # and wrong after the next keystore change, silently.
      # ------------------------------------------------------------------
      - name: Write the digital asset links
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'unisave' }}
        run: |
          FINGERPRINT=$(keytool -list -v -keystore android.keystore -alias uni \
            -storepass "$STORE_PASS" 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d '\r')

          # A fingerprint is colon-separated hex pairs. Anything else means
          # keytool printed a warning where the value should be, and a
          # malformed file here fails silently later as "still shows a URL bar".
          case "$FINGERPRINT" in
            *:*:*) ;;
            *) echo "::error::Could not read a SHA-256 fingerprint from the keystore."; exit 1 ;;
          esac
          echo "Signing fingerprint: $FINGERPRINT"

          export FINGERPRINT
          export PACKAGE="$(node -p "require('./twa-manifest.json').packageId")"
          mkdir -p public/.well-known
          node -e "
            const fs = require('fs');
            fs.writeFileSync('public/.well-known/assetlinks.json', JSON.stringify([{
              relation: ['delegate_permission/common.handle_all_urls'],
              target: {
                namespace: 'android_app',
                package_name: process.env.PACKAGE,
                sha256_cert_fingerprints: [process.env.FINGERPRINT],
              },
            }], null, 2) + '\n');
          "
          cat public/.well-known/assetlinks.json

      # Committed back so the next deploy serves it. Without this the file
      # exists only inside a finished CI job, which helps nobody.
      - name: Commit it if it changed
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then ask. `git diff` does not report untracked files,
          # so checking before staging says "nothing changed" the one time it
          # matters most — the first run, when the file is brand new.
          git add uni-notes/public/.well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "Asset links already match this signing key."
            exit 0
          fi
          git commit -m "Update Android asset links for the current signing key"
          # No loop: this workflow only triggers on its own file and the TWA
          # manifest, neither of which is touched here.
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Name the files properly
        run: |
          cp app-release-signed.apk Uni.apk
          ls -lh Uni.apk

      # The keystore goes to an artifact, never to the Release. A Release is
      # public; the signing key must not be.
      - uses: actions/upload-artifact@v4
        with:
          name: uni-android-keystore
          path: |
            uni-notes/android.keystore
            uni-notes/app-release-bundle.aab
            uni-notes/assetlinks.json
          if-no-files-found: warn

      # A plain download link, no GitHub login, no zip to unpack — which is the
      # difference between "here is the app" and "here is a set of instructions".
      # Shares the tag with the Windows build so both downloads sit on one page.
      - name: Publish to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installers
          name: Uni — install it
          files: uni-notes/Uni.apk
          body: |
            Download Uni here. No account, no app store, nothing to unzip.

            **Android** — download `Uni.apk`, open it, and allow installing from
            that source when asked. It appears in the app drawer with its own
            icon like anything else.

            **Windows** — `Uni-Setup` installs it properly, with a Start menu and
            desktop shortcut, and never asks for an administrator password.
            `Uni-Portable` is a single file that runs from anywhere, including a
            USB stick.

            The first time Windows opens it, a blue "Windows protected your PC"
            box appears. That is normal for any program without a paid
            certificate — click **More info**, then **Run anyway**. Once only.

            Signing in, syncing and sharing work exactly as they do on the
            website. It is the same Uni, in its own window.
      - name: What happened
        if: always()
        run: |
          {
            echo "### Android build"
            echo
            echo "Points at: $APP_URL"
            echo
            echo "\`Uni.apk\` is on the **Releases** page of this repository — open that"
            echo "link on the phone, tap the file, and allow installing from that source."
            echo
            if [ "${{ steps.key.outputs.generated }}" = "true" ]; then
              echo "> **Save the signing key now.** This run made a new one. Download the"
              echo "> **uni-android-keystore** artifact and put \`android.keystore\` into repo"
              echo "> secrets as \`ANDROID_KEYSTORE_BASE64\` (base64 encoded). Without it, the"
              echo "> next build produces an app that refuses to install over this one."
            else
              echo "Signed with the stored key, so it installs over the previous version."
            fi
            echo
            echo "**About the address bar at the top of the app.** Android hides it only"
            echo "when the site proves it owns the app, by serving a file at the very root"
            echo "of the domain: \`/.well-known/assetlinks.json\`. On GitHub Pages the app"
            echo "lives at a subpath and the root belongs to github.io, so that file cannot"
            echo "be put there. Deploying to Firebase Hosting instead gives a domain root"
            echo "we control, and then the bar disappears. Everything else works either way."
          } >> "$GITHUB_STEP_SUMMARY"
