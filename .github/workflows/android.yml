# Builds the Android app, so nobody needs a JDK, the Android SDK or Bubblewrap
# on their own machine.
#
# Run it from the repo's Actions tab: "Build Android APK" -> Run workflow.
# It produces two downloads:
#
#   uni-android       the .apk to sideload, and the .aab if you ever want Play
#   uni-assetlinks    the file that removes the URL bar (see the summary)
#
# The app is a Trusted Web Activity around the deployed PWA, so the site has to
# be live first. It reads uni-notes/twa-manifest.json, which is checked in —
# that is what keeps the build non-interactive.
#
# SIGNING. First run generates a keystore and hands it back as an artifact,
# because Android will not install an update signed with a different key than
# the version already on the phone. Save it into the repo secrets straight away
# and every later build reuses it:
#
#   ANDROID_KEYSTORE_BASE64   base64 of android.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#
# Lose the keystore and you cannot update an installed app — only uninstall and
# reinstall, which is fine for two phones and fatal on Play.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Deployed host (no https://)'
        required: false
        default: 'unisave-e8483.web.app'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uni-notes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail early and clearly if the site is not deployed yet — otherwise
      # Bubblewrap fails much later with something far less obvious.
      - name: Check the site is live
        run: |
          URL="https://${{ inputs.host }}/manifest.webmanifest"
          echo "Fetching $URL"
          if ! curl -fsS "$URL" -o /tmp/manifest.json; then
            echo "::error::$URL is not reachable. Deploy first: npm run deploy"
            exit 1
          fi
          cat /tmp/manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android.keystore
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Reusing the stored keystore."
          else
            # A throwaway-but-persistent key. The passwords are not a secret in
            # any meaningful sense on the first run; the point is that the same
            # key gets reused, which is what lets updates install over old ones.
            keytool -genkeypair -v -keystore android.keystore \
              -alias uni -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass unisave -keypass unisave \
              -dname "CN=Uni, OU=Uni, O=Uni, L=Bishkek, C=KG"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A new keystore was generated. Download the uni-android artifact and save android.keystore into repo secrets as ANDROID_KEYSTORE_BASE64, or future builds will not install over this one."
          fi

      - name: Build
        env:
          HOST: ${{ inputs.host }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'unisave' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'unisave' }}
        run: |
          # Point the checked-in manifest at whichever host was asked for.
          node -e "
            const fs = require('fs');
            const host = process.env.HOST;
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            const swap = (s) => typeof s === 'string' ? s.replaceAll(m.host, host) : s;
            m.iconUrl = swap(m.iconUrl);
            m.maskableIconUrl = swap(m.maskableIconUrl);
            m.webManifestUrl = swap(m.webManifestUrl);
            m.fullScopeUrl = swap(m.fullScopeUrl);
            (m.shortcuts || []).forEach((s) => { s.chosenIconUrl = swap(s.chosenIconUrl); });
            m.host = host;
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "
          # Bubblewrap prompts for the passwords unless they arrive on stdin.
          printf '%s\n%s\n' "$STORE_PASS" "$KEY_PASS" | bubblewrap build --skipPwaValidation

      - name: Collect the asset-links file
        run: bubblewrap fingerprint generateAssetLinks --output assetlinks.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: uni-android
          path: |
            uni-notes/app-release-signed.apk
            uni-notes/app-release-bundle.aab
            uni-notes/android.keystore
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: uni-assetlinks
          path: uni-notes/assetlinks.json
          if-no-files-found: warn

      - name: What to do next
        run: |
          {
            echo "### Android build finished"
            echo
            echo "1. Download the **uni-android** artifact below."
            if [ "${{ steps.key.outputs.generated }}" = "true" ]; then
              echo "2. **Save the keystore now.** Run \`base64 -w0 android.keystore\` and put the result in repo secrets as \`ANDROID_KEYSTORE_BASE64\`. Without it, a later build produces an app that will not install over this one."
            else
              echo "2. Signed with the stored keystore, so it installs over the previous version."
            fi
            echo "3. Copy \`app-release-signed.apk\` to the phone and open it. Allow installing from that source once."
            echo
            echo "**To remove the URL bar:** download **uni-assetlinks**, put \`assetlinks.json\` at \`uni-notes/public/.well-known/assetlinks.json\`, run \`npm run deploy\`, then reinstall the APK."
          } >> "$GITHUB_STEP_SUMMARY"
