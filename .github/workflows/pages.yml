# Publishes Uni to GitHub Pages.
#
# This exists so the app can be deployed with no terminal — from a tablet, from
# a phone, from the GitHub website. Firebase Hosting needs the Firebase CLI and
# a login; Pages needs a button.
#
# The site lands at https://<user>.github.io/<repo>/ , which is a subpath rather
# than a domain root. Vite is configured with `base: './'`, so every asset is
# requested relative to the page and the whole thing works at any depth. Routing
# is hash-based, so there are no unknown paths for Pages to 404 on either.
#
# ONE THING TO DO AFTERWARDS: add the Pages domain to Firebase Console ->
# Authentication -> Settings -> Authorized domains, or sign-in will open and
# immediately close.
#
# On the Firebase config below being in plain sight: a Firebase web config is
# designed to ship inside the browser and is already readable in the built
# bundle by anyone who opens dev tools. It is not a credential. What protects
# the data is the Firestore rules and sign-in. Putting it here rather than in
# repository secrets keeps this workflow runnable with zero setup, which is the
# entire point of the file.

name: Publish to GitHub Pages

on:
  push:
    branches: [claude/uni-notes-editor-wilz3q]
    paths: ['uni-notes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uni-notes

    env:
      VITE_FIREBASE_API_KEY: AIzaSyBoZMgZUEc_mNf7xkKElQddGp8EZOwrjHs
      VITE_FIREBASE_AUTH_DOMAIN: unisave-e8483.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: unisave-e8483
      VITE_FIREBASE_STORAGE_BUCKET: unisave-e8483.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '905127413855'
      VITE_FIREBASE_APP_ID: '1:905127413855:web:1a01eb17a3d8115908f3ea'
      VITE_FIREBASE_REGION: us-central1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uni-notes/package-lock.json

      - run: npm ci
      - run: npm run build

      # Pages runs Jekyll over the upload unless told not to, and Jekyll drops
      # every file and folder beginning with an underscore.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uni-notes/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
